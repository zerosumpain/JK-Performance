# JK Performance — iPhone app. Generate with: xcodegen generate --spec ios/project.yml
name: JKPerformance
options:
  bundleIdPrefix: com.jkperformance
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    # Matches the App Store Connect record "JK Performance" (created 2026-11-20).
    PRODUCT_BUNDLE_IDENTIFIER: com.jkperformance.app
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  JKPerformance:
    type: application
    platform: iOS
    sources:
      - JKPerformance
    info:
      path: JKPerformance/Info.plist
      properties:
        CFBundleDisplayName: JK Performance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Newsreader (SIL OFL 1.1, Resources/Fonts): the serif for JK's voice. Variable,
        # opsz 6-72 and wght 200-800; PostScript names Newsreader16pt-Regular / -Italic.
        UIAppFonts: [Newsreader-Roman.ttf, Newsreader-Italic.ttf]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Portrait-only is refused at upload unless the app opts out of iPad multitasking.
        UIRequiresFullScreen: true
        # The API origin (docs/API.md). APIClient reads it at launch.
        JKAPIBaseURL: 'https://jk.strangeramblings.com'
        NSHealthShareUsageDescription: 'JK Performance reads your steps, sleep, heart rate, active energy, weight, distance and workouts so your habits, progress and challenges fill in automatically and, if you choose to share, your coach can see your activity and recovery.'
        NSMicrophoneUsageDescription: 'JK Performance uses the microphone to record voice notes for your coach and letters.'
        NSCameraUsageDescription: 'JK Performance films the form-check clips you choose to send to your coach.'
        NSPhotoLibraryUsageDescription: 'JK Performance sends the photos and clips you pick to your coach.'
        NSCalendarsWriteOnlyAccessUsageDescription: 'JK Performance adds the sessions you choose to your calendar.'
        # Required at upload whenever the HealthKit entitlement is present, even though the app only reads.
        NSHealthUpdateUsageDescription: 'JK Performance does not write to Apple Health. It only reads the data listed above, with your permission.'
    # Sign in with Apple is the account; HealthKit is read-only; push. All must be
    # ticked on the App ID for TestFlight signing to carry them.
    entitlements:
      path: JKPerformance/JKPerformance.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Push from the server; TestFlight/App Store builds use production APNs.
        aps-environment: production
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
  # Decoder and text-rule tests against the API contract fixtures (desk-v2
  # F13/F14/F19). Run with `xcodebuild test`; on Linux,
  # JKPerformanceTests/Linux/check.sh runs the same files in Docker.
  JKPerformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JKPerformanceTests
        excludes:
          - Linux/**
          - Fixtures/**
    dependencies:
      - target: JKPerformance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jkperformance.app.tests
schemes:
  JKPerformance:
    build:
      targets:
        JKPerformance: all
        JKPerformanceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JKPerformanceTests
    archive:
      config: Release
