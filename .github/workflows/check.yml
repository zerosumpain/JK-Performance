name: Check app
# macOS runners bill at 10x, so this runs only when the app's sources change,
# on pull requests and on main. Debug for the simulator, then Release (what
# TestFlight archives), both unsigned.
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/check.yml', 'scripts/lint-design.sh', 'scripts/lint-design-allow.txt', 'scripts/contrast-check.mjs']
  pull_request:
    paths: ['ios/**', '.github/workflows/check.yml', 'scripts/lint-design.sh', 'scripts/lint-design-allow.txt', 'scripts/contrast-check.mjs']
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Cheap Linux gate first: design tokens (docs/design/plan-act-review.md, "Look").
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/lint-design.sh ios
      - run: node scripts/contrast-check.mjs ios
  ios:
    needs: design
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          test "$SDK_MAJOR" -ge 26
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Build Debug (simulator)
        run: |
          set -o pipefail
          xcodebuild build -project ios/JKPerformance.xcodeproj -scheme JKPerformance -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Build Release (simulator)
        run: |
          set -o pipefail
          xcodebuild build -project ios/JKPerformance.xcodeproj -scheme JKPerformance -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO | tee release-build.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: build-logs
          path: '*.log'
          retention-days: 7
