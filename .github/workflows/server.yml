name: Server
# The API's tests: a cheap ubuntu runner, on every change to server/.
on:
  push:
    branches: [main]
    paths: ['server/**', 'package.json', 'Dockerfile', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'package.json', 'Dockerfile', '.github/workflows/server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: node --disable-warning=ExperimentalWarning --test --test-reporter=spec server/test/*.test.mjs
      - run: docker build -t jk-api:ci .
