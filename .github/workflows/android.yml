name: Android
# Pull requests compile the app; every merge to main that changes it builds a
# signed release APK and keeps it as the run's artifact, which porkserv picks
# up for the private download page (scripts/android-publish.sh). Logs are
# PUBLIC: nothing secret may be echoed.
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/lint-design.sh', 'scripts/contrast-check.mjs']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/lint-design.sh', 'scripts/contrast-check.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Design lint and contrast (design tokens)
        working-directory: .
        run: |
          scripts/lint-design.sh android
          node scripts/contrast-check.mjs --platform android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug build and lint
        if: github.event_name == 'pull_request'
        run: ./gradlew --console=plain assembleDebug lintDebug
      - name: Signing and Firebase files
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jk-release.jks"
          # Push is optional: without the Firebase file the app builds with push off.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > app/google-services.json; else echo "::warning::No GOOGLE_SERVICES_JSON: push is off in this build"; fi
      - name: Release APK
        if: github.event_name != 'pull_request'
        env:
          JK_KEYSTORE_FILE: ${{ runner.temp }}/jk-release.jks
          JK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JK_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew --console=plain assembleRelease
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/jk-performance.apk"
          printf '{"version":"0.1.%s","builtAt":"%s","commit":"%s"}\n' "$GITHUB_RUN_NUMBER" "$(date -u +%FT%TZ)" "$GITHUB_SHA" > "$RUNNER_TEMP/out/version.json"
          rm -f "$JK_KEYSTORE_FILE" app/google-services.json
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: jk-performance-apk
          path: ${{ runner.temp }}/out/
          retention-days: 30
